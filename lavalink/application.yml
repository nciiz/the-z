server:
  address: 127.0.0.1
  port: 2333

lavalink:
  plugins:
    - dependency: "dev.lavalink.youtube:youtube-plugin:1.18.2"
      snapshot: false
  server:
    password: ${LAVALINK_PASSWORD}
    sources:
      youtube: false
      soundcloud: true
      http: true
    bufferDurationMs: 400
    frameBufferDurationMs: 5000
    opusEncodingQuality: 5
    playerUpdateInterval: 5
    soundcloudSearchEnabled: true

plugins:
  youtube:
    enabled: true
    allowSearch: true
    allowDirectVideoIds: true
    allowDirectPlaylistIds: false
    # MUSIC is search-only, so keep playback-capable clients first. YouTube
    # availability varies by client and region, so keep several playback
    # clients enabled and prioritize ones that return audio formats.
    clients:
      - ANDROID_MUSIC
      - MWEB
      - TVHTML5_SIMPLY
      - ANDROID_VR
      - WEBEMBEDDED
      - WEB

logging:
  level:
    root: INFO
    lavalink: INFO
  file:
    path: ./logs/
    max-history: 1
